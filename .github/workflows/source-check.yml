
name: IsoCam Android ARM64 Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ndk;27.2.12479018

      - name: Build IsoCam
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --config Release

      - name: Package IsoCam
        run: |
          mkdir -p package/config

          cp build/libIsoCam.so package/libIsoCam.so

          cat > package/manifest.json <<'EOF'
          {
            "type": "preload-native",
            "name": "IsoCam",
            "author": "S0ulzz",
            "version": "0.1.0",
            "entry": "libIsoCam.so",
            "minecraft_versions": [],
            "overwrite_files": [],
            "overwrite_folders": []
          }
          EOF

          cd package
          zip -r ../IsoCam-Android-ARM64.levipack manifest.json libIsoCam.so
          cd ..

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: IsoCam-LeviPack-ARM64
          path: IsoCam-Android-ARM64.levipack
